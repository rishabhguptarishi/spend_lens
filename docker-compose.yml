# Local development stack. Production image: Dockerfile + Kamal (no compose file).
#
#   docker compose build
#   docker compose up
#
# App: http://localhost:3000
# Ollama on your Mac: set OLLAMA_URL=http://host.docker.internal:11434 in .env

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spend_lens_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spend_lens_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_URL: postgres://postgres:postgres@db:5432/spend_lens_development
      # Reach Ollama running on the host (Docker Desktop Mac/Windows)
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
      - rails_tmp:/rails/tmp
      - rails_storage:/rails/storage
    ports:
      - "3000:3000"
      - "3036:3036"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle_cache:
  node_modules:
  rails_tmp:
  rails_storage:
